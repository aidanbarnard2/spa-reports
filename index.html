<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Saint Paul Agency</title>
<style>
:root { --bg: #EDF1F7; --card: #FFFFFF; --ink: #10182F; --ink-2: #4A5672; }
@media (prefers-color-scheme: dark) { :root { --bg: #0B1226; --card: #111B35; --ink: #F2F5FB; --ink-2: #AAB6D3; } }
html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
main { min-height: 100vh; display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
.card { background: var(--card); border-radius: 16px; padding: 32px 36px; max-width: 30rem; text-align: center; box-shadow: 0 6px 24px rgba(16, 24, 47, .12); }
h1 { margin: 0 0 8px; font-size: 26px; }
p { margin: 0; color: var(--ink-2); font-size: 17px; line-height: 1.5; }
</style>
</head>
<body>
<main><div class="card"><h1>Saint Paul Agency</h1><p>Reports are shared by direct link. If you were sent one, open that link.</p></div></main>
</body>
</html>
